# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-digilent-bsp"
BBFILE_PATTERN_meta-digilent-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-digilent-bsp = "7"

LAYERDEPENDS_meta-digilent-bsp = "meta-nile"
LAYERSERIES_COMPAT_meta-digilent-bsp = "scarthgap"
